# The example app through the real box (core, engine, harness, shipped pack). It proves core's
# and the engine's behaviour at the pins, so it runs when they or the box change, not on every PR.
name: e2e

on:
  pull_request:
    paths: [pins.yaml, "box/**", .github/workflows/e2e.yml]
  push:
    branches: [main, development]
    paths: [pins.yaml, "box/**", .github/workflows/e2e.yml]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: go/Makefile
          python-version: "3.12"
      # the box the webapp e2e runs through signs its ledger and observes repositories
      - uses: sigstore/cosign-installer@v3
      - run: go install github.com/zricethezav/gitleaks/v8@v8.18.4 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
