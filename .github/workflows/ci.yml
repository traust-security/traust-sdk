# Runs on every PR, in the merge queue, and on main and development after each merge, so two
# PRs green on their own bases can't land red together. Mirrors the Makefile targets.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -race ./...
        working-directory: go
      - run: go test -race ./...
        working-directory: go/examples/webapp

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: make security

  # Generated code matches the pinned CORE_REF and was never hand-edited.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: go/Makefile
          python-version: "3.12"
      - run: make -C go check-drift

  # The generated client against traust-server built from core at CORE_REF.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: go/Makefile
          python-version: "3.12"
      # the box the webapp e2e runs through signs its ledger and observes repositories
      - uses: sigstore/cosign-installer@v3
      - run: go install github.com/zricethezav/gitleaks/v8@v8.18.4 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make guardrails
        env:
          GUARDRAILS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GUARDRAILS_HEAD: ${{ github.event.pull_request.head.sha }}

  # The bloat gates: what the diff adds must replace, be justified, and stay off
  # generated ground (make lean). Full history: the base is a merge-base.
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make lean
        env:
          LEAN_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
